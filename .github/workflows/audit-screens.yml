name: Visual audit (temporary)
on:
  push:
    branches: ["audit-screens"]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: |
          python -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          python .github/audit/ci_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: shots
          path: shots
